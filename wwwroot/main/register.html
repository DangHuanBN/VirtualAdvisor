<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | AiEducation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="login.css">

    <style>
        /* Thêm CSS cho trang đăng ký */
        .logo {
            display: flex;
            align-items: center;
        }

        .ai-red {
            color: #DC143C;
            /* Crimson Red */
        }

        .edu-green {
            color: #2a52be;
            /* Navy Blue (xanh đậm nhẹ) */
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .logo img {
            height: 40px;
        }

        .logo>span:not(.logo-text) {
            font-size: 24px;
            font-weight: 700;
            margin-left: 10px;
            color: #2a52be;
        }

        .register-form {
            max-width: 500px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .form-row .form-group {
            flex: 1;
        }

        .register-btn {
            margin-top: 15px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gender-option input {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="login-container register-form">
        <div class="login-header">
            <div class="logo " style="margin-left: 28%;">
                <img src="/anh/z6500003339608_4464c998e6b622928c1d65ef8166d187.jpg" alt="">
                <span class="logo-text">
                    <span style=" color: #DC143C;">AI</span><span class="edu-green">Education</span>
                </span>
            </div>
            <h1>Đăng ký tài khoản</h1>
            <p>Hãy tạo tài khoản mới để bắt đầu trải nghiệm học tập!</p>
        </div>

        <form class="login-form" id="registerForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập <span class="required">*</span></label>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mật khẩu <span class="required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                        <i class="fas fa-eye toggle-password" data-target="password"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        <i class="fas fa-eye toggle-password" data-target="confirmPassword"></i>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">Họ và tên <span class="required">*</span></label>
                <div class="input-group">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" id="fullName" placeholder="Nhập họ và tên đầy đủ" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Nhập địa chỉ email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" placeholder="Nhập số điện thoại">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Ngày sinh</label>
                    <div class="input-group">
                        <i class="fas fa-calendar"></i>
                        <input type="date" id="dob">
                    </div>
                </div>

                <div class="form-group">
                    <label>Giới tính</label>
                    <div class="gender-options">
                        <div class="gender-option">
                            <input type="radio" id="male" name="gender" value="male" checked>
                            <label for="male">Nam</label>
                        </div>
                        <div class="gender-option">
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Nữ</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <div class="input-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="address" placeholder="Nhập địa chỉ">
                </div>
            </div>

            <!-- Phần lựa chọn vai trò (đã ẩn) -->
            <div class="form-group" style="display: none;">
                <input type="hidden" id="roleStudent" name="role" value="Student" checked>
            </div>

            <button type="submit" class="login-btn register-btn">Đăng ký</button>

            <div class="register-link">
                Bạn đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>

            <div class="message-container" style="display: none;"></div>
        </form>
    </div>
    <script src="api.js"></script>
    <script>
        // Toggle hiển thị mật khẩu
        document.querySelectorAll('.toggle-password').forEach(toggle => {
            toggle.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
    </script>
    <script src="register.js"></script>
</body>

</html>
